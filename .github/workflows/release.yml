name: Release

# 버전 태그를 올리면 검사 후 GitHub Release와 npm에 같은 패키지를 배포한다.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::태그 $TAG 와 package.json 버전 $VERSION 이 다릅니다."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --out "./judo-motion-%v.tgz"
      - run: cp dist/standalone.js judo-motion.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "judo-motion-${TAG#v}.tgz" judo-motion.js --title "$TAG" --generate-notes

  npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the release tarball to npm
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://registry.npmjs.org/@uos-judo-jiho%2fjudo-motion)
          case "$STATUS" in
            200)
              FILE="judo-motion-${TAG#v}.tgz"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE"
              npm publish "./$FILE"
              ;;
            404)
              echo "::notice::첫 npm 게시에는 GitHub Release의 tgz를 사용하세요."
              ;;
            *)
              echo "::error::npm 레지스트리 조회 실패 (HTTP $STATUS)"
              exit 1
              ;;
          esac
