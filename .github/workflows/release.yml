name: Release

# 안정판 태그는 GitHub Release와 npm으로, main 푸시는 npm canary로 배포한다.
on:
  push:
    branches: ["main"]
    tags: ["v*", "!v*-canary.*"]
    # GitHub applies these paths only to branch pushes, not release tags.
    paths:
      - "src/**"
      - "!src/main.ts"
      - "!src/style.css"
      - "!src/characters/portrait.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "README.md"
      - "LICENSE"

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::태그 $TAG 와 package.json 버전 $VERSION 이 다릅니다."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --out "./judo-motion-%v.tgz"
      - run: cp dist/standalone.js judo-motion.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "judo-motion-${TAG#v}.tgz" judo-motion.js --title "$TAG" --generate-notes

  npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the release tarball to npm
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://registry.npmjs.org/@uos-judo-jiho%2fjudo-motion)
          case "$STATUS" in
            200)
              FILE="judo-motion-${TAG#v}.tgz"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE"
              npm publish "./$FILE"
              ;;
            404)
              echo "::notice::첫 npm 게시에는 GitHub Release의 tgz를 사용하세요."
              ;;
            *)
              echo "::error::npm 레지스트리 조회 실패 (HTTP $STATUS)"
              exit 1
              ;;
          esac

  canary:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: npm-canary
      queue: max
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish and tag canary
        shell: bash
        run: |
          registry="https://registry.npmjs.org/@uos-judo-jiho%2fjudo-motion"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$registry")
          case "$status" in
            200) ;;
            404)
              echo "::notice::안정판을 처음 게시하고 Trusted Publisher를 설정하면 canary 배포가 시작됩니다."
              exit 0
              ;;
            *)
              echo "::error::npm 레지스트리 조회 실패 (HTTP $status)"
              exit 1
              ;;
          esac

          commit_time=$(git show -s --format=%ct "$GITHUB_SHA")
          version=$(node - "$commit_time" "$GITHUB_SHA" <<'JS'
          const [time, sha] = process.argv.slice(2);
          const base = require("./package.json").version;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(base);
          if (!match) throw new Error(`Expected a stable package version, got ${base}`);
          const [, major, minor, patch] = match;
          const stamp = new Date(Number(time) * 1000)
            .toISOString().slice(2, 19).replace(/\D/g, "");
          process.stdout.write(`${major}.${minor}.${Number(patch) + 1}-canary.${stamp}.g${sha.slice(0, 8)}`);
          JS
          )

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$registry/$version")
          case "$status" in
            200) echo "Canary $version already exists on npm" ;;
            404)
              pnpm install --frozen-lockfile
              pnpm check
              npm version "$version" --no-git-tag-version --ignore-scripts
              pnpm pack --out "./judo-motion-%v.tgz"
              npm publish "./judo-motion-$version.tgz" --tag canary
              ;;
            *)
              echo "::error::canary 버전 조회 실패 (HTTP $status)"
              exit 1
              ;;
          esac
          git push origin "$GITHUB_SHA:refs/tags/v$version"
